      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Expenses]
      operationId: getPayment
      summary: Detalhes
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Expenses]
      operationId: updatePayment
      summary: Atualização parcial (OWNER, ADMIN, MEMBER). Exige `baseVersion`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPatch'
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Expenses]
      operationId: deletePayment
      summary: Remove (soft delete; deixa um tombstone para o sync)
      responses:
        '204':
          description: Removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/trips/{tripId}/maps/location:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Places]
      operationId: renderLocationMap
      summary: Desenha o mapa de um único local (item do roteiro, lugar, restaurante ou hotel). Só existe quando o servidor tem GOOGLE_MAPS_API_KEY
      description: |
        Devolve uma imagem PNG com o local marcado. A imagem é feita na hora e nada dela é guardada no servidor.
        Qualquer membro da viagem (inclusive LEITOR) pode pedir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationMapRequest'
      responses:
        '200':
          description: A imagem do mapa (cache privado de 5 minutos).
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/trips/{tripId}/maps/day:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Itinerary]
      operationId: planDayMap
      summary: Planeja o mapa de um dia. Dado a lista de paradas em ordem, devolve o trecho entre cada par (tempo, distância e traçado) e, se pedido, uma imagem numerada. Só existe quando o servidor tem GOOGLE_MAPS_API_KEY
      description: |
        Cabem até 80 paradas, o bastante para a viagem toda. Um trecho sem rota encontrada volta com `available: false`, sem inventar tempo, e nunca derruba o dia inteiro.
        Paradas consecutivas no mesmo lugar não geram trecho. O traçado (`polyline`) é para ser desenhado num mapa do
        Google. Nada é guardado no servidor. Qualquer membro da viagem (inclusive LEITOR) pode pedir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayMapRequest'
      responses:
        '200':
          description: Os trechos do dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/trips/{tripId}/checklist-items:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Checklist]
      operationId: listChecklistItems
      summary: Lista os itens da checklist
      responses:
        '200':
          description: Lista de itens da checklist.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Checklist]
      operationId: createChecklistItem
      summary: Cria um item da checklist (OWNER, ADMIN, MEMBER). O id pode ser gerado pelo cliente (UUID v7), o que torna a criação idempotente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemCreate'
      responses:
        '201':
          description: Criado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/checklist-items/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Checklist]
      operationId: getChecklistItem
      summary: Detalhes
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Checklist]
      operationId: updateChecklistItem
      summary: Atualização parcial (OWNER, ADMIN, MEMBER), inclusive marcar/desmarcar. Exige `baseVersion`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemPatch'
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Checklist]
      operationId: deleteChecklistItem
      summary: Remove (soft delete; deixa um tombstone para o sync)
      responses:
        '204':
          description: Removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/trips/{tripId}/documents:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Lista os documentos visíveis ao usuário (privados só aparecem ao dono)
      responses:
        '200':
          description: Metadados; o conteúdo se baixa por link assinado.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Documents]
      operationId: initDocumentUpload
      summary: Registra um documento PENDING e devolve o link assinado para enviar o arquivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitDocumentRequest'
      responses:
        '201':
          description: Documento pendente e requisição de upload.
          content:
            application/json:
              schema:
                type: object
                required: [document, upload]
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  upload:
                    $ref: '#/components/schemas/SignedRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Metadados do documento
      responses:
        '200':
          description: O documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Documents]
      operationId: updateDocument
      summary: Renomeia, muda tipo, visibilidade ou vínculo. Exige `baseVersion`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatch'
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Remove o documento e apaga o arquivo
      responses:
        '204':
          description: Removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/trips/{tripId}/documents/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      summary: Confirma o upload. O servidor confere tamanho e SHA-256 antes de marcar como READY
      responses:
        '200':
          description: Documento READY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/documents/{id}/download:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: Devolve um link assinado e de curta duração para baixar o arquivo
      responses:
        '200':
          description: Link de download.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [document, download]
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  download:
                    $ref: '#/components/schemas/SignedRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/storage/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Documents]
      operationId: uploadDocumentContent
      summary: Recebe o arquivo (corpo binário). A autorização é o próprio token assinado, sem bearer
      security: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Arquivo armazenado.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [Documents]
      operationId: downloadDocumentContent
      summary: Entrega o arquivo. A autorização é o próprio token assinado, sem bearer
      security: []
      responses:
        '200':
          description: Conteúdo do arquivo.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/trips/{tripId}/sync:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Sync]
      operationId: pullChanges
      summary: Mudanças da viagem desde o cursor (ausente = carga inicial), incluindo tombstones
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor opaco devolvido pela chamada anterior.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Página de mudanças.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sync]
      operationId: pushMutations
      summary: Aplica mutações feitas offline. Cada uma tem resultado próprio e reenviar o mesmo mutationId é seguro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mutations]
              properties:
                mutations:
                  type: array
                  items:
                    $ref: '#/components/schemas/Mutation'
      responses:
        '200':
          description: Um resultado por mutação, na mesma ordem.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sessão devolvido por register e login (prefixo `rt_`, validade de 30 dias).

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Session:
      description: Sessão criada.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    BadRequest:
      description: Requisição malformada (JSON inválido, campo desconhecido, id fora do formato).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Sem autenticação, token inválido ou expirado, ou credenciais inválidas.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Autenticado, mas sem permissão para esta ação.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente, ou que o usuário não pode saber que existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito de estado (versão desatualizada, email já cadastrado, id já usado, membro já existe).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Dados bem formados que violam uma regra; `errors` lista os campos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de requisições excedido.
      headers:
        Retry-After:
          description: Segundos até poder tentar de novo.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unavailable:
      description: O provedor externo (Google) está indisponível, não respondeu a tempo, ou o limite mensal de chamadas foi atingido (`provider_quota_exhausted`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ErrorCode:
      type: string
      description: Código estável do erro; use-o para traduzir a mensagem.
      enum:
        - route_not_found
        - malformed_json
        - body_too_large
        - invalid_id
        - unauthenticated
        - invalid_token
        - invalid_credentials
        - invalid_registration_code
        - email_taken
        - validation_failed
        - rate_limited
        - internal_error
        - user_not_found
        - trip_not_found
        - trip_id_taken
        - version_conflict
        - empty_patch
        - forbidden
        - member_exists
        - member_not_found
        - owner_locked
        - owner_assignment
        - already_owner
        - base_version_required
        - day_exists
        - day_not_empty
        - document_not_found
        - entity_deleted
        - invalid_cursor
        - invalid_lat
        - invalid_lng
        - invalid_limit
        - invalid_link
        - invalid_mutation
        - invalid_payload
        - item_not_found
        - link_expired
        - mutation_id_reused
        - object_not_found
        - place_not_found
        - provider_unavailable
        - provider_quota_exhausted
        - size_mismatch
        - too_many_mutations
        - unknown_entity
        - unsupported_operation
        - upload_mismatch
        - upload_missing

    Problem:
      type: object
      required: [status, title, code, detail]
      properties:
        status:
          type: integer
        title:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: Mensagem em inglês, segura para exibir como fallback.
        requestId:
          type: string
          description: Identificador para suporte; o mesmo vai no header X-Request-ID.
        errors:
          type: array
          description: Presente em erros de validação (422).
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Role:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]

    AssignableRole:
      type: string
      description: Papéis que podem ser atribuídos diretamente. OWNER só muda por transfer-ownership.
      enum: [ADMIN, MEMBER, VIEWER]

    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, registrationCode]
      properties:
        email:
          type: string
        name:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 10
          maxLength: 128
        registrationCode:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    TripCapabilities:
      type: object
      description: O que o usuário pode fazer nesta viagem. Calculado pelo servidor; a UI só lê.
      required: [updateTrip, manageMembers, writeContent, deleteTrip, transferOwnership, leave, addableRoles]
      properties:
        updateTrip:
          type: boolean
        manageMembers:
          type: boolean
        writeContent:
          type: boolean
        deleteTrip:
          type: boolean
        transferOwnership:
          type: boolean
        leave:
          type: boolean
        addableRoles:
          type: array
          description: Papéis que o usuário pode atribuir ao adicionar um membro.
          items:
            $ref: '#/components/schemas/AssignableRole'

    Trip:
      type: object
      required:
        - id
        - name
        - destination
        - startDate
        - endDate
        - timezone
        - currency
        - ownerId
        - myRole
        - capabilities
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
          description: Data civil (YYYY-MM-DD), sem fuso horário.
        endDate:
          type: string
          format: date
        timezone:
          type: string
          description: Fuso IANA, por exemplo America/Sao_Paulo.
        currency:
          type: string
          description: Código ISO 4217.
        ownerId:
          type: string
          format: uuid
        myRole:
          $ref: '#/components/schemas/Role'
        capabilities:
          $ref: '#/components/schemas/TripCapabilities'
        version:
          type: integer
          format: int64
          description: Enviar como baseVersion ao atualizar.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

