openapi: 3.1.0

info:
  title: RinoTravel API
  version: 1.0.0
  description: |
    API do RinoTravel. Fases implementadas: fundação, autenticação, viagens com membros, roteiro, lugares e restaurantes, voos e hotéis, gastos e orçamento, documentos, sync offline-first e adaptadores Google.

    Erros usam `application/problem+json` (RFC 9457). O campo `code` é estável e pensado para o cliente traduzir a mensagem.
    Quem não é membro de uma viagem recebe sempre `404 trip_not_found`, idêntico ao de uma viagem inexistente.

servers:
  - url: http://localhost:8080
    description: Desenvolvimento local

tags:
  - name: Health
    description: Verificação de disponibilidade.
  - name: Auth
    description: Cadastro com código de convite, login, logout e o usuário atual.
  - name: Trips
    description: Viagens das quais o usuário é membro.
  - name: Members
    description: Membros de uma viagem e seus papéis.
  - name: Itinerary
    description: Dias, itens e a linha do tempo unificada do roteiro.
  - name: Places
    description: Lista de desejos de lugares e restaurantes, e a busca no Google Places.
  - name: Bookings
    description: Voos e hospedagens.
  - name: Expenses
    description: Gastos da viagem (planejados e pagos), ligados a lugares, e o orçamento por categoria.
  - name: Checklist
    description: Lista de tarefas e do que levar na mala, manual, sem sugestão automática.
  - name: Documents
    description: Arquivos da viagem, armazenados no MongoDB (GridFS) e entregues por link assinado.
  - name: Sync
    description: Protocolo de sincronização offline-first (pull por cursor, push de mutações).

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        '200':
          description: A API está de pé.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Cria a conta (exige o código de convite) e devolve a sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autentica e devolve uma nova sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoga a sessão atual
      responses:
        '204':
          description: Sessão revogada.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Usuário autenticado
      responses:
        '200':
          description: O usuário da sessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: Viagens das quais sou membro (mais recentes primeiro)
      responses:
        '200':
          description: Lista de viagens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Cria uma viagem; quem cria vira OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Viagem criada.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Detalhes da viagem
      responses:
        '200':
          description: A viagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Trips]
      operationId: updateTrip
      summary: Atualização parcial (OWNER e ADMIN). Exige a versão que o cliente viu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Viagem atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Trips]
      operationId: deleteTrip
      summary: Remove a viagem (somente OWNER; soft delete)
      responses:
        '204':
          description: Viagem removida.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/trips/{tripId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Trips]
      operationId: transferOwnership
      summary: Passa a posse para outro membro (somente OWNER); o dono anterior vira ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: A viagem, já com o novo dono e o meu novo papel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/members:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Members]
      operationId: listMembers
      summary: Membros da viagem (OWNER primeiro), com o que eu posso fazer com cada um
      responses:
        '200':
          description: Lista de membros.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Members]
      operationId: addMember
      summary: Adiciona um membro pelo email (OWNER e ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Membro adicionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Muda o papel de um membro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Membro atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove um membro, ou sai da viagem quando `userId` é o meu
      responses:
        '204':
          description: Membro removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/itinerary-days:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Itinerary]
      operationId: listItineraryDays
      summary: Lista os dias do roteiro
      responses:
        '200':
          description: Lista de os dias do roteiro.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItineraryDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Itinerary]
      operationId: createItineraryDay
      summary: Cria os dias do roteiro (OWNER, ADMIN, MEMBER). O id pode ser gerado pelo cliente (UUID v7), o que torna a criação idempotente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryDayCreate'
      responses:
        '201':
          description: Criado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/itinerary-days/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Itinerary]
      operationId: getItineraryDay
      summary: Detalhes
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Itinerary]
      operationId: updateItineraryDay
      summary: Atualização parcial (OWNER, ADMIN, MEMBER). Exige `baseVersion`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryDayPatch'
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Itinerary]
      operationId: deleteItineraryDay
      summary: Remove (soft delete; deixa um tombstone para o sync)
      responses:
        '204':
          description: Removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/trips/{tripId}/itinerary-items:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Itinerary]
      operationId: listItineraryItems
      summary: Lista os itens do roteiro
      responses:
        '200':
          description: Lista de os itens do roteiro.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Itinerary]
      operationId: createItineraryItem
      summary: Cria os itens do roteiro (OWNER, ADMIN, MEMBER). O id pode ser gerado pelo cliente (UUID v7), o que torna a criação idempotente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemCreate'
      responses:
        '201':
          description: Criado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/itinerary-items/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Itinerary]
      operationId: getItineraryItem
      summary: Detalhes
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Itinerary]
      operationId: updateItineraryItem
      summary: Atualização parcial (OWNER, ADMIN, MEMBER). Exige `baseVersion`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemPatch'
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Itinerary]
      operationId: deleteItineraryItem
      summary: Remove (soft delete; deixa um tombstone para o sync)
      responses:
        '204':
          description: Removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/trips/{tripId}/itinerary-items/from-place:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Itinerary]
      operationId: scheduleItemFromPlace
      summary: Agenda um lugar da lista de desejos como item do roteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleFromPlaceRequest'
      responses:
        '201':
          description: Item criado a partir do lugar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/itinerary:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Itinerary]
      operationId: getItinerary
      summary: Linha do tempo unificada por dia (itens, voos, hotéis e reservas), com horários locais
      responses:
        '200':
          description: Dias em ordem cronológica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/trips/{tripId}/places:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Places]
      operationId: listPlaces
      summary: Lista os lugares (lista de desejos)
      responses:
        '200':
          description: Lista de os lugares (lista de desejos).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Places]
      operationId: createPlace
      summary: Cria os lugares (lista de desejos) (OWNER, ADMIN, MEMBER). O id pode ser gerado pelo cliente (UUID v7), o que torna a criação idempotente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCreate'
      responses:
        '201':
          description: Criado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/trips/{tripId}/places/{id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Places]
      operationId: getPlace
      summary: Detalhes
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Places]
      operationId: updatePlace
      summary: Atualização parcial (OWNER, ADMIN, MEMBER). Exige `baseVersion`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacePatch'
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Places]
      operationId: deletePlace
      summary: Remove (soft delete; deixa um tombstone para o sync)
      responses:
        '204':
          description: Removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/trips/{tripId}/restaurants:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Places]
      operationId: listRestaurants
      summary: Lista os restaurantes
