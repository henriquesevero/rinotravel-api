                - $ref: '#/components/schemas/Money'
                - type: 'null'
            actual:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
            date:
              type: [string, 'null']
              format: date
            link:
              oneOf:
                - $ref: '#/components/schemas/ExpenseLink'
                - type: 'null'
            notes:
              type: string

    BudgetLimit:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [category, amount]
          description: |
            O máximo que a viagem toda (`TOTAL`) ou uma categoria deve custar. Há um limite por categoria
            em cada viagem; repetir devolve `budget_exists`.
          properties:
            category:
              type: string
              enum: [TOTAL, FOOD, LODGING, TRANSPORT, ACTIVITIES, SOUVENIRS, CLOTHES, ELECTRONICS, OTHER]
            amount:
              $ref: '#/components/schemas/Money'

    BudgetLimitCreate:
      type: object
      additionalProperties: false
      required: [category, amount]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [TOTAL, FOOD, LODGING, TRANSPORT, ACTIVITIES, SOUVENIRS, CLOTHES, ELECTRONICS, OTHER]
        amount:
          $ref: '#/components/schemas/Money'

    BudgetLimitPatch:
      allOf:
        - $ref: '#/components/schemas/BaseVersion'
        - type: object
          additionalProperties: false
          properties:
            amount:
              $ref: '#/components/schemas/Money'

    Payment:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [link, paid]
          description: |
            Diz se o preço de um registro (ingresso, voo, refeição do roteiro...) já foi pago. Esses preços
            moram nos próprios registros e não são copiados para os gastos, então o pago fica aqui. Sem marca,
            o preço conta como pago quando a data passa; uma marca vale nos dois sentidos. Uma por registro
            (repetir devolve `payment_exists`).
          properties:
            link:
              $ref: '#/components/schemas/ExpenseLink'
            paid:
              type: boolean

    PaymentCreate:
      type: object
      additionalProperties: false
      required: [link]
      properties:
        id:
          type: string
          format: uuid
        link:
          $ref: '#/components/schemas/ExpenseLink'
        paid:
          type: boolean
          description: Padrão `true`.

    PaymentPatch:
      allOf:
        - $ref: '#/components/schemas/BaseVersion'
        - type: object
          additionalProperties: false
          properties:
            paid:
              type: boolean

    TicketKind:
      type: string
      enum: [ATTRACTION, SHOW, MUSEUM, SPORT, TOUR, TRANSPORT, OTHER]

    Ticket:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [name, kind, quantity, status]
          description: |
            Ingresso de algo a fazer (show, museu, passeio). `location` é onde ele é usado e coloca a
            visita no mapa do dia; com `start` ele entra na linha do tempo do dia. O arquivo é um
            documento da viagem (`documentId`), que continua listado em `/documents`.
          properties:
            name:
              type: string
            kind:
              $ref: '#/components/schemas/TicketKind'
            location:
              $ref: '#/components/schemas/Location'
            start:
              $ref: '#/components/schemas/ZonedTime'
            end:
              $ref: '#/components/schemas/ZonedTime'
            quantity:
              type: integer
              minimum: 1
              maximum: 999
            confirmationCode:
              type: string
              description: Omitido para VIEWER.
            seat:
              type: string
              description: Setor, fileira, portão ou horário marcado.
            cost:
              $ref: '#/components/schemas/Money'
            status:
              $ref: '#/components/schemas/PlanStatus'
            documentId:
              type: string
              format: uuid
              description: Documento da viagem com o arquivo do ingresso. Pode apontar para um arquivo que o usuário não vê (privado de outra pessoa) ou já removido.
            notes:
              type: string

    TicketCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Opcional. Gerado pelo cliente (UUID v7) para criação idempotente.
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TicketKind'
        status:
          $ref: '#/components/schemas/PlanStatus'
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        start:
          oneOf:
            - $ref: '#/components/schemas/ZonedTime'
            - type: 'null'
        end:
          oneOf:
            - $ref: '#/components/schemas/ZonedTime'
            - type: 'null'
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        confirmationCode:
          type: string
        seat:
          type: string
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        documentId:
          type: [string, 'null']
          format: uuid
          description: Um documento pronto (READY) da viagem que o usuário possa ver.
        notes:
          type: string

    TicketPatch:
      allOf:
        - $ref: '#/components/schemas/BaseVersion'
        - type: object
          additionalProperties: false
          properties:
            name:
              type: string
            kind:
              $ref: '#/components/schemas/TicketKind'
            status:
              $ref: '#/components/schemas/PlanStatus'
            location:
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'
            start:
              oneOf:
                - $ref: '#/components/schemas/ZonedTime'
                - type: 'null'
            end:
              oneOf:
                - $ref: '#/components/schemas/ZonedTime'
                - type: 'null'
            quantity:
              type: integer
              minimum: 1
              maximum: 999
            confirmationCode:
              type: string
            seat:
              type: string
            cost:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
            documentId:
              type: [string, 'null']
              format: uuid
              description: '`null` tira o arquivo do ingresso (o documento continua nos documentos).'
            notes:
              type: string

    LocationMapRequest:
      type: object
      additionalProperties: false
      required: [location]
      properties:
        location:
          $ref: '#/components/schemas/Location'
        language:
          type: string

    DayMapStop:
      type: object
      additionalProperties: false
      required: [location]
      properties:
        label:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        group:
          type: integer
          minimum: 0
          maximum: 1000
          description: Agrupa as paradas que andam juntas (o dia da viagem); cada grupo ganha uma cor na imagem. 0 para um dia só.
        pin:
          type: string
          maxLength: 1
          description: O que o pino mostra na imagem (um caractere). Vazio numera as paradas em ordem.

    DayMapRequest:
      type: object
      additionalProperties: false
      required: [stops]
      properties:
        stops:
          type: array
          minItems: 2
          maxItems: 80
          items:
            $ref: '#/components/schemas/DayMapStop'
        mode:
          type: string
          description: Como o dia é percorrido. Padrão TRANSIT.
          enum: [TRANSIT, WALKING, DRIVING]
        language:
          type: string
        includeImage:
          type: boolean
          description: Pede também uma imagem com todas as paradas numeradas e as rotas.

    DayMapLeg:
      type: object
      required: [from, to, available]
      properties:
        from:
          type: integer
          description: Índice da parada de partida.
        to:
          type: integer
        available:
          type: boolean
          description: Falso quando nenhuma rota foi encontrada.
        durationSeconds:
          type: integer
        distanceMeters:
          type: integer
        polyline:
          type: string
          description: Traçado codificado (Google), para desenhar num mapa do Google.

    DayMap:
      type: object
      required: [legs]
      properties:
        legs:
          type: array
          items:
            $ref: '#/components/schemas/DayMapLeg'
        image:
          type: string
          description: Data URI PNG, presente só se pedida e desenhada.

    DocumentLink:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          description: Tipo do registro vinculado (por exemplo flight, hotel, restaurant, itinerary_item).
        id:
          type: string
          format: uuid

    Document:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [ownerId, name, type, fileName, mimeType, size, checksum, status, visibility]
          properties:
            ownerId:
              type: string
              format: uuid
            name:
              type: string
            type:
              $ref: '#/components/schemas/DocumentType'
            fileName:
              type: string
            mimeType:
              type: string
            size:
              type: integer
              format: int64
            checksum:
              type: string
              description: SHA-256 em hexadecimal. Serve para o cliente saber se sua cópia offline está atual.
            status:
              $ref: '#/components/schemas/DocumentStatus'
            visibility:
              $ref: '#/components/schemas/DocumentVisibility'
            link:
              $ref: '#/components/schemas/DocumentLink'

    InitDocumentRequest:
      type: object
      additionalProperties: false
      required: [name, type, fileName, mimeType, size, checksum]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        checksum:
          type: string
          description: SHA-256 do arquivo em hexadecimal.
        visibility:
          $ref: '#/components/schemas/DocumentVisibility'
        link:
          $ref: '#/components/schemas/DocumentLink'

    DocumentPatch:
      allOf:
        - $ref: '#/components/schemas/BaseVersion'
        - type: object
          properties:
            name:
              type: string
            type:
              $ref: '#/components/schemas/DocumentType'
            visibility:
              $ref: '#/components/schemas/DocumentVisibility'
            link:
              oneOf:
                - $ref: '#/components/schemas/DocumentLink'
                - type: 'null'

    SignedRequest:
      type: object
      description: Requisição que o cliente executa como está. A URL já carrega a autorização.
      required: [url, method, expiresAt]
      properties:
        url:
          type: string
        method:
          type: string
          enum: [GET, PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time

    SyncEntity:
      type: string
      enum: [trip, itinerary_day, itinerary_item, place, restaurant, flight, hotel, document, checklist_item]

    SyncChange:
      type: object
      required: [entity, id, op, version]
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id:
          type: string
          format: uuid
        op:
          type: string
          enum: [upsert, delete]
        version:
          type: integer
          format: int64
        record:
          type: object
          description: Registro completo no mesmo formato da API REST. Ausente em `delete`.
          additionalProperties: true

    PullResult:
      type: object
      required: [changes, cursor, hasMore, resetRequired, serverTime]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        cursor:
          type: string
          description: Guarde e envie na próxima chamada.
        hasMore:
          type: boolean
          description: Verdadeiro quando há mais páginas; chame de novo com o novo cursor.
        resetRequired:
          type: boolean
          description: O cursor é antigo demais (tombstones já removidos). Descarte o cache da viagem e recarregue sem cursor.
        serverTime:
          type: string
          format: date-time

    Mutation:
      type: object
      additionalProperties: false
      required: [mutationId, entity, entityId, operation]
      properties:
        mutationId:
          type: string
          format: uuid
          description: Chave de idempotência. Reusar o id com outro conteúdo é rejeitado.
        entity:
          $ref: '#/components/schemas/SyncEntity'
        entityId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        baseVersion:
          type: integer
          format: int64
          description: Obrigatório em UPDATE e DELETE.
        clientTimestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: Mesmo corpo do create ou patch REST da entidade.

    MutationResult:
      type: object
      required: [mutationId, status]
      properties:
        mutationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, duplicate, conflict, rejected]
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        version:
          type: integer
          format: int64
        record:
          type: object
          additionalProperties: true
          description: Em `conflict`, a versão atual do servidor para o cliente resolver.
